[package]
name = "infercraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Kreive Tech <contact@kreive.com.br>"]
license = "MIT"
description = "High-performance local LLM inference engine with zero-copy mmap, layer-by-layer weight streaming, and hardware calibration for Rust."
repository = "https://github.com/kreivetech/infercraft"
homepage = "https://kreive.com.br"
readme = "README.md"
keywords = ["llm", "inference", "streaming", "gguf", "candle"]
categories = ["science", "algorithms", "development-tools"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23.2", features = ["http"] }
memmap2 = "0.9"
tokio = { version = "1.40", features = ["sync", "fs", "io-util", "rt", "time", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
once_cell = "1.21"
rayon = "1.10"
regex = "1.11"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]

[dev-dependencies]
tempfile = "3.17"
tokio = { version = "1.40", features = ["rt-multi-thread"] }
